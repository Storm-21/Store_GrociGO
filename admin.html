<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GrociGO Admin | Shop Manager</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function AdminDashboard() {
            const [orders, setOrders] = useState([
                { id: 101, customer: "Amit Sharma", items: "Milk x2, Bread x1", total: 173, status: "Pending", assignedTo: "" },
                { id: 102, customer: "Sana Khan", items: "Eggs x1, Lays x5", total: 160, status: "Packed", assignedTo: "Rahul" }
            ]);

            const RIDERS = ["Rahul", "Amit", "Vikram", "Sumit"];

            const assignRider = (orderId, riderName) => {
                setOrders(orders.map(order => 
                    order.id === orderId ? { ...order, assignedTo: riderName, status: "Out for Delivery" } : order
                ));
                alert(`Order #${orderId} assigned to ${riderName}`);
            };

            return (
                <div class="p-8">
                    <header class="flex justify-between items-center mb-8">
                        <h1 class="text-3xl font-black text-yellow-500">GrociGO <span class="text-gray-400 text-lg font-normal">| Admin Panel</span></h1>
                        <div class="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">Store: OPEN</div>
                    </header>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* ORDER LIST SLOTS */}
                        <div class="lg:col-span-2">
                            <h2 class="text-xl font-bold mb-4">Incoming Orders</h2>
                            {orders.map(order => (
                                <div key={order.id} class="bg-white p-6 rounded-xl shadow-sm mb-4 border-l-4 border-yellow-500">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <p class="text-sm text-gray-500">Order #{order.id}</p>
                                            <h3 class="text-lg font-bold">{order.customer}</h3>
                                            <p class="text-gray-700 mt-2">{order.items}</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-xl font-bold text-green-700">₹{order.total}</p>
                                            <span class="text-xs font-bold uppercase px-2 py-1 bg-yellow-100 text-yellow-700 rounded">
                                                {order.status}
                                            </span>
                                        </div>
                                    </div>

                                    <div class="mt-4 pt-4 border-t flex items-center justify-between">
                                        <div class="flex items-center">
                                            <p class="text-sm font-bold mr-3">Assign Rider:</p>
                                            <select 
                                                class="border p-2 rounded-md bg-gray-50"
                                                onChange={(e) => assignRider(order.id, e.target.value)}
                                                value={order.assignedTo}
                                            >
                                                <option value="">Select Agent</option>
                                                {RIDERS.map(r => <option key={r} value={r}>{r}</option>)}
                                            </select>
                                        </div>
                                        {order.assignedTo && (
                                            <p class="text-sm text-blue-600 font-bold">Currently with: {order.assignedTo}</p>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* QUICK INVENTORY SLOTS */}
                        <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
                            <h2 class="text-xl font-bold mb-4">Stock Management</h2>
                            <div class="space-y-4">
                                {["Milk", "Bread", "Eggs", "Coke"].map(item => (
                                    <div key={item} class="flex justify-between items-center pb-2 border-b">
                                        <span>{item}</span>
                                        <button class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">In Stock</button>
                                    </div>
                                ))}
                            </div>
                            <button class="w-full mt-6 bg-gray-800 text-white py-3 rounded-lg font-bold">Update All Stock</button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminDashboard />);
    </script>
</body>
</html>
